[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbvisual"
version = "1.2.0.0"
description = "Local, self-contained visual builder for forms, sheets and reports over existing databases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dbvisual" }]
keywords = ["database", "sqlalchemy", "forms", "reports", "local", "visual-db"]

dependencies = [
    "sqlalchemy>=2.0",
    "sqlglot>=28,<31",
    "filelock>=3.13",
    "pydantic>=2",
    # Phase 2 — monolithic app shell, local metadata store & secrets.
    "nicegui>=3,<4",
    "fastapi>=0.109",
    "pywebview>=5.0.1,<7; sys_platform == 'win32' or sys_platform == 'darwin'",
    "keyring>=24",
    "cryptography>=42",
    "platformdirs>=4",
    # Snapshots — point-in-time Excel export.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.16,<7"]
postgresql = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
duckdb = ["duckdb-engine>=0.13", "duckdb>=1.5.3"]
# Convenience group that pulls in every supported driver.
all-drivers = [
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "pyodbc>=5.0",
    "oracledb>=2.0",
    "duckdb-engine>=0.13", "duckdb>=1.5.3",
]
# Development / testing.
dev = ["pytest>=7.4", "httpx>=0.27", "duckdb-engine>=0.13", "duckdb>=1.5.3"]

[project.scripts]
dbvisual = "dbvisual.app.cli:main"

[tool.setuptools.packages.find]
include = ["dbvisual*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
