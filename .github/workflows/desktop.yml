name: Desktop candidates
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'dbvisual/**'
      - 'tests/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'main.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
            artifact: DBVisual-Windows-x64-Setup.exe
          - os: macos-15
            architecture: arm64
            artifact: DBVisual-macOS-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install the native ODBC driver manager
        if: runner.os == 'macOS'
        run: brew install unixodbc
      - name: Install build dependencies
        run: python -m pip install ".[dev,all-drivers,packaging]"
      - name: Test source
        run: python -m pytest -q -rs
      - name: Freeze the application
        run: python scripts/build_desktop.py
      - name: Start the frozen application
        run: python scripts/smoke_desktop.py
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          mkdir build/dmg
          ditto dist/DBVisual.app build/dmg/DBVisual.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname DBVisual -srcfolder build/dmg -format UDZO dist/DBVisual-macOS-arm64.dmg
          hdiutil verify dist/DBVisual-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
